name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Manifest and plugin structure
        run: node scripts/validate.mjs
      - name: Claude Code validation
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for dir in skafld-vc skafld-vc-connectors skafld-vc-platform; do claude plugin validate "$dir"; done
